<style>

let S={topic:'all',len:10},Q=[],idx=0,score=0,wrong=[],mode='';
const bestKey=()=>'g4aard_'+S.topic+'_'+S.len;
function getBest(){try{return JSON.parse(localStorage.getItem(bestKey()))}catch(e){return null}}
function setBest(sc,n){try{const b=getBest();if(!b||sc/n>b.s/b.n)localStorage.setItem(bestKey(),JSON.stringify({s:sc,n:n}))}catch(e){}}
function pool(t){return QB.filter(q=>t==='all'||q.t===t)}
function start(){
  const L=['10','20','alle'];

  app.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{S.topic=x.dataset.t;start()});
  app.querySelectorAll('[data-l]').forEach(x=>x.onclick=()=>{S.len=x.dataset.l==='alle'?'alle':+x.dataset.l;start()});
  $('#go').onclick=()=>{let p=shuf(pool(S.topic));if(S.len!=='alle')p=p.slice(0,S.len);run(p,'normal')};
  scrollTo(0,0);
}
function run(list,m){Q=list.map(q=>{const o=q.ci?shuf([q.ci,...q.wi]):shuf([q.c,...q.w]);return {...q,o}});idx=0;score=0;wrong=[];mode=m;show()}
function show(){
  const q=Q[idx],tp=TOP[q.t],pic=!!q.ci;
  const opts=q.o.map((o,i)=>pic?`<button class="opt pic" data-i="${i}"><span class="k">${'ABCD'[i]}</span><img src="${IMG[o]}" alt="Prent ${'ABCD'[i]}"></button>`
    :`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('');
  app.innerHTML=`<div class="top"><button class="home" title="Tuis" id="home">🏠</button><div class="bar"><i style="width:${idx/Q.length*100}%"></i></div><span class="cnt">${idx+1}/${Q.length}</span><span class="badge" title="Telling">${score}</span></div>
  <div class="card ${idx%2?'tr':'tl'}" style="--c:${tp.c};--h:${tp.h}"><span class="tag">${tp.e} ${esc(q.s)}</span>
  ${q.img?`<img class="qimg" src="${IMG[q.img]}" alt="Prent by die vraag">`:''}
  <div class="qt">${esc(q.q)}</div><div class="opts ${pic?'pics':''}">${opts}</div><div id="fb"></div></div>`;
  $('#home').onclick=()=>{if(confirm('Terug na die begin? Jou telling vir hierdie rondte sal verlore gaan.'))start()};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  scrollTo(0,0);
}
function answer(i){
  const q=Q[idx],corr=q.ci||q.c,ok=q.o[i]===corr;
  app.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.o[j]===corr)b.classList.add('ok');else if(j===i)b.classList.add('no');else b.classList.add('dim')});
  if(ok)score++;else wrong.push({q,your:q.o[i]});
  $('.badge').textContent=score;
  const last=idx===Q.length-1;
  $('#fb').innerHTML=`<div class="fb" style="--fc:${ok?'#2b8a3e':'#c92a2a'};--fbg:${ok?'#ebfbee':'#fff5f5'}"><b>${ok?'✅ Reg!':'❌ Nie heeltemal nie'}</b>${ok?'':(q.ci?'Die regte prent is groen gemerk. ':'Regte antwoord: <b style="display:inline;font-size:22px">'+esc(corr)+'</b>. ')}${esc(q.e)}</div>
  <button class="go ${last?'pur':'alt'}" id="nx">${last?'SIEN MY TELLING 🏆':'VOLGENDE ➜'}</button>`;
  $('#nx').onclick=()=>{idx++;idx<Q.length?show():end()};
  $('#nx').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function end(){
  const n=Q.length,p=score/n;
  if(mode==='normal')setBest(score,n);
  const m=p===1?'Uitstekend! Alles reg! 🌟':p>=.8?'Baie goed gedoen! 🎉':p>=.6?'Mooi so! Oefen nog \'n bietjie. 👍':p>=.4?'Jy kom daar! Probeer weer. 💪':'Moenie opgee nie! Lees jou kaarte weer en probeer weer. 🐾';
  const rv=wrong.map(w=>{const q=w.q;
    if(q.ci)return `<li><div class="q">${esc(q.q)}</div><span class="y">❌ Jou keuse:</span> <img src="${IMG[w.your]}" alt=""> <span class="a">✅ Reg:</span> <img src="${IMG[q.ci]}" alt=""></li>`;
    return `<li>${q.img?`<img src="${IMG[q.img]}" alt="">`:''}<div class="q">${esc(q.q)}</div><div class="y">❌ Jou antwoord: ${esc(w.your)}</div><div class="a">✅ Regte antwoord: ${esc(q.c)}</div></li>`}).join('');
  const b=getBest();
  app.innerHTML=`<h1>KLAAR! 🐾</h1>
  <div class="card tl" style="--c:#e8590c"><div class="score"><span class="big">${score}/${n}</span><span class="badge" style="width:64px;height:64px;font-size:26px">${Math.round(p*100)}%</span></div>
  <div class="msg">${m}</div>${mode==='normal'&&b?`<div class="best">🏆 Beste telling vir ${TOP[S.topic].n}, ${S.len==='alle'?'alle vrae':S.len+' vrae'}: ${b.s}/${b.n}</div>`:''}</div>
  ${wrong.length?`<div class="card tr" style="--c:#e03131;--h:#c92a2a"><h2>Vrae wat verkeerd was (${wrong.length})</h2><ul class="rev">${rv}</ul></div>`:''}
  <div class="btns"><button class="go alt" id="again">PROBEER WEER 🔁</button>${wrong.length?`<button class="go pur" id="fix">OEFEN NET MY FOUTE ✏️</button>`:''}</div>
  <button class="go" style="background:#0c8599;border-color:#0b5563;margin-top:10px" id="home2">🏠 TUIS</button>`;
  $('#again').onclick=()=>{let p=shuf(pool(S.topic));if(S.len!=='alle')p=p.slice(0,S.len);run(p,'normal')};
  if(wrong.length)$('#fix').onclick=()=>run(shuf(wrong.map(w=>w.q)),'fix');
  $('#home2').onclick=start;
  scrollTo(0,0);
}
start();
</script></body></html>
